name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    # Builds the `builder` stage of the Dockerfile, which already contains
    # the Go toolchain and Ceph dev libraries needed to compile ceph_exporter.
    - name: Build in Docker
      run: docker build --target builder -t ceph_exporter:build .

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    # Reuses the `builder` stage, but sets TEST so the Dockerfile runs
    # `go test -tags nautilus -v -race -count=1 ./...` before compiling.
    - name: Test in Docker
      run: docker build --target builder --build-arg TEST=1 -t ceph_exporter:test .
